  <!-- Brand Title -->
  <text x="110" y="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    PDF<tspan fill="url(#goldGrad)">DaVinci</tspan>
  </text>
  <rect x="575" y="190" width="145" height="42" rx="10" fill="#f59e0b" fill-opacity="0.18" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="647" y="218" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="900" fill="#fcd34d" letter-spacing="2">
    PRO RAM
