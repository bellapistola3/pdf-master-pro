  <text x="110" y="358" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Convert PDF to High-Res JPG (ZIP), Editable Word (.DOC) &amp; Clean Text (.TXT)
  </text>

  <!-- 4 Feature Pills -->
  <g transform="translate(110, 415)">
    <rect x="0" y="0" width="230" height="90" rx="18" fill="url(#indigoGrad)" />
    <text x="24" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">PDF to JPG</text>
    <text x="24" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">300 DPI • Batch .ZIP</text>

    <rect x="250" y="0" width="230" height="90" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="274" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">PDF to Word</text>
    <text x="274" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#7dd3fc">Editable .DOC Export</text>

    <rect x="500" y="0" width="230" height="90" rx="18" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="524" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">PDF to Text</text>
    <text x="524" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#6ee7b7">Clean UTF-8 .TXT</text>

    <rect x="750" y="0" width="230" height="90" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="774" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#fcd34d">100% Free</text>
