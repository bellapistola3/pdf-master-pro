services:
  - type: web
    name: pdf-master-pro-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    plan: starter # bump to 'standard' or higher for real traffic — OCR/compress are CPU-heavy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /app/storage
      - key: APP_BASE_URL
        sync: false # set to your deployed web app URL after first deploy
      - key: CORS_ORIGIN
        sync: false # set to your deployed web app URL — do not leave as '*' in production
      - key: MAX_FILE_SIZE_MB_FREE
        value: 25
      - key: MAX_FILE_SIZE_MB_PRO
        value: 500
      - key: FREE_DAILY_OPS
        value: 5
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_BUSINESS
        sync: false
    disk:
      name: pdf-master-storage
      mountPath: /app/storage
      sizeGB: 10
